<!DOCTYPE html>
<html lang="zh-HK" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CU BUS</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Inter', 'system-ui'],
                        mono: ['JetBrains Mono']
                    },
                    boxShadow: {
                        'apple': '0 8px 30px rgb(0,0,0,0.04)',
                        'apple-dark': '0 8px 30px rgb(0,0,0,0.2)'
                    },
                    colors: {
                        apple: { gray: '#F5F5F7', dark: '#1D1D1F', accent: '#007AFF' }
                    }
                }
            }
        }

        const SETTINGS_KEY = 'cuhk_bus_vibe_settings';
        let settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {
            stopId: '',
            lang: 'zh',
            isDark: window.matchMedia('(prefers-color-scheme: dark)').matches,
            mode: (new Date().getDay() === 0) ? 'sunday' : 'weekday',
            autoSwitchStop: true,
            testTime: null,
            testDay: null,
            isDevMode: false,
            showPastBuses: false,
            isTestTimeFixed: true
        };

        let { lang, isDark, mode: currentMode, autoSwitchStop, testTime, testDay, isDevMode, showPastBuses, isTestTimeFixed } = settings;
        let currentStopId = settings.stopId || '';
        let testTimeSetAt = (testTime && !isTestTimeFixed) ? Date.now() : null;

        if (isDark) document.documentElement.classList.add('dark');
    </script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }
        #modal-route-icon {
            font-size: clamp(1.2rem, 5vw, 1.5rem);
        }
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
        }
        .dark .glass {
            background: rgba(29, 29, 31, 0.75);
        }
        .apple-card {
            @apply bg-white/70 dark:bg-apple-dark/60 border border-white/20 dark:border-white/5 shadow-apple transition-[background-color,border-color,box-shadow] duration-300 ease-in-out;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
        }
        .sticky-panel {
            position: sticky;
            top: 80px;
            z-index: 40;
        }
        @media (max-width: 767px) {
            .sticky-panel {
                margin: 0;
                padding: 1rem 0;
                border-bottom: none;
                background: transparent;
            }
        }
        .bus-card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }
        @media (max-width: 640px) {
            .bus-card-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
        }
        .pb-safe-area {
            padding-bottom: calc(2.5rem + env(safe-area-inset-bottom));
        }
        nav.sticky {
            z-index: 100;
        }
        #settings-modal {
            z-index: 110;
        }

        #route-modal {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.35s;
        }
        #route-modal.visible {
            opacity: 1;
            visibility: visible;
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
        }
        body.modal-open {
            overflow: hidden;
        }

        #route-modal-card {
            transition: transform 0.45s cubic-bezier(0.28, 0.84, 0.42, 1), opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @media (max-width: 767px) {
            #route-modal-card {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                height: auto;
                max-height: calc(100dvh - 64px);
                border-radius: 28px 28px 0 0;
                transform: translateY(110%);
                padding-bottom: calc(1rem + env(safe-area-inset-bottom));
                background: #F5F5F7;
                box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.12);
            }
            .dark #route-modal-card {
                background: #1C1C1E;
                box-shadow: 0 -12px 48px rgba(0, 0, 0, 0.4);
            }
            #route-modal.visible #route-modal-card {
                transform: translateY(0);
                opacity: 1;
            }
            .dragging {
                transition: none !important;
            }
        }
        @media (min-width: 768px) {
            #route-modal {
                justify-content: flex-end;
                align-items: center;
                padding: 2.5rem;
                top: 0;
            }
            #route-modal-card {
                height: auto;
                max-height: calc(100vh - 5rem);
                width: 420px;
                border-radius: 24px;
                transform: translateX(110%) scale(0.96);
                opacity: 0;
                box-shadow: -16px 0 64px rgba(0, 0, 0, 0.18), 0 8px 32px rgba(0, 0, 0, 0.08);
            }
            .dark #route-modal-card {
                box-shadow: -16px 0 64px rgba(0, 0, 0, 0.5), 0 8px 32px rgba(0, 0, 0, 0.3);
            }
            #route-modal.visible #route-modal-card {
                transform: translateX(0) scale(1);
                opacity: 1;
            }
        }

        .info-pill {
            @apply bg-white/60 dark:bg-white/[0.03] border border-black/[0.08] dark:border-white/[0.08] rounded-2xl p-4 flex flex-col gap-1.5 shadow-sm hover:shadow-md transition-[box-shadow,transform] duration-200;
            height: auto;
            min-height: min-content;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            will-change: transform;
        }
        .info-pill:active {
            transform: scale(0.985);
        }

        #route-modal-card .overflow-y-auto {
            padding-top: 0.75rem;
            padding-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overscroll-behavior: contain;
        }

        .pill-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(60, 60, 67, 0.6);
        }
        .dark .pill-label {
            color: rgba(235, 235, 245, 0.6);
        }
        .pill-value {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.4;
            color: rgb(28, 28, 30);
        }
        .dark .pill-value {
            color: rgb(242, 242, 247);
        }

        .apple-grabber {
            width: 36px;
            height: 5px;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .dark .apple-grabber {
            background: rgba(255, 255, 255, 0.15);
        }

        @keyframes apple-rotation {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        .animate-apple-spin {
            animation: apple-rotation 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .timeline-scroll-container {
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .timeline-scroll-container::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }

        .locating-spinner {
            background: transparent !important;
            border: 2px solid rgba(0, 122, 255, 0.3);
            border-top-color: #007AFF;
            border-radius: 50%;
            width: 14px !important;
            height: 14px !important;
            box-shadow: none !important;
            animation: apple-rotation 1s linear infinite;
        }

        #settings-backdrop {
            backdrop-filter: blur(12px) saturate(150%);
            -webkit-backdrop-filter: blur(12px) saturate(150%);
            transition: opacity 0.25s cubic-bezier(0.32, 0.72, 0, 1);
            will-change: opacity;
        }
        #settings-card {
            transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform, opacity;
        }

        .timeline-mask {
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .apple-puck {
            width: 14px;
            height: 14px;
            background-color: #007AFF;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.2);
            z-index: 20;
            position: relative;
        }
        .dark .apple-puck {
            border-color: #1C1C1E;
            box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.25);
        }

        .skeleton-pulse {
            animation: skeleton-loading 1.5s ease-in-out infinite;
            background: linear-gradient(90deg, #e5e5ea 25%, #f0f0f5 50%, #e5e5ea 75%);
            background-size: 200% 100%;
        }
        .dark .skeleton-pulse {
            background: linear-gradient(90deg, #2c2c2e 25%, #3a3a3c 50%, #2c2c2e 75%);
            background-size: 200% 100%;
        }
        @keyframes skeleton-loading {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }
    </style>
</head>
<body class="bg-apple-gray dark:bg-[#000000] text-slate-900 dark:text-slate-100 min-h-screen font-sans antialiased tracking-tight">

    <nav class="sticky top-0 z-[100] glass border-b border-black/[0.05] dark:border-white/[0.05] h-16" role="banner" aria-label="Main navigation">
        <div class="max-w-7xl mx-auto px-6 h-full flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-black dark:bg-white rounded-[10px] flex items-center justify-center text-white dark:text-black font-[900] text-lg tracking-tighter shadow-apple" aria-hidden="true">CU</div>
                <div class="flex flex-col justify-center h-9">
                    <span class="text-[14px] font-extrabold tracking-tight leading-none text-slate-900 dark:text-white">BUS</span>
                    <div class="flex flex-col leading-none mt-0.5">
                        <span id="current-date" class="text-[9px] font-bold text-slate-500 uppercase tracking-wider">---</span>
                        <span id="current-time" class="text-[9px] font-bold text-slate-400 font-mono mt-[1px]" aria-live="polite">00:00:00</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="toggleSettings()" class="w-9 h-9 flex items-center justify-center hover:bg-black/[0.05] dark:hover:bg-white/[0.1] rounded-full transition-[background-color,transform] active:scale-90" aria-label="設定">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-[18px] w-[18px] text-slate-700 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>

                <div class="relative w-9 h-9 flex items-center justify-center">
                    <svg class="absolute inset-0 w-full h-full -rotate-90 pointer-events-none transform scale-110" viewBox="0 0 36 36" aria-hidden="true">
                        <path class="text-black/5 dark:text-white/5" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" />
                        <path id="refresh-ring" class="text-apple-accent transition-[stroke-dashoffset] duration-1000 ease-linear" stroke-dasharray="100, 100" stroke-dashoffset="100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
                    </svg>
                    <button onclick="loadData()" id="refresh-btn" class="w-full h-full bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 text-slate-700 dark:text-slate-300 rounded-full transition-[background-color,transform] active:scale-90 flex items-center justify-center z-10" aria-label="重新整理">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-3 md:py-6">
        <div class="flex flex-col md:flex-row gap-4 lg:gap-6">
            <aside class="w-full md:w-80 shrink-0">
                <div class="sticky-panel space-y-6">
                    <div id="mode-selector" class="flex p-1 bg-black/[0.05] dark:bg-white/[0.1] rounded-[12px] backdrop-blur-sm" role="tablist" aria-label="Schedule mode"></div>
                    <div class="apple-card rounded-[24px] overflow-hidden">
                        <button onclick="toggleStopList()" class="w-full py-4 px-5 flex items-center justify-between md:hidden transition-colors" aria-expanded="false" aria-controls="stop-list-container">
                            <div class="flex items-center gap-3">
                                <div id="mobile-status-dot" class="w-2 h-2 rounded-full bg-apple-accent shadow-[0_0_8px_rgba(0,122,255,0.5)] transition-[background-color,box-shadow,border-color,opacity]"></div>
                                <span id="mobile-current-stop" class="font-semibold text-sm text-slate-900 dark:text-white">Select Stop</span>
                            </div>
                            <svg id="stop-chevron" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 transition-transform duration-300" viewBox="0 0 20 20" fill="currentColor"><path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" /></svg>
                        </button>

                        <div id="stop-list-container" class="fixed inset-0 z-[100] hidden md:static md:block md:z-auto group" aria-hidden="true">
                            <div class="absolute inset-0 bg-black/40 backdrop-blur-sm md:hidden transition-opacity opacity-0 group-[.visible]:opacity-100" onclick="toggleStopList()"></div>
                            <div id="stop-list-sheet" class="absolute bottom-0 inset-x-0 max-h-[calc(100dvh-80px)] h-[85vh] bg-[#F2F2F7] dark:bg-[#1c1c1e] rounded-t-[20px] shadow-[0_-10px_40px_rgba(0,0,0,0.2)] transform translate-y-full transition-transform duration-300 ease-[cubic-bezier(0.32,0.72,0,1)] group-[.visible]:translate-y-0 flex flex-col md:relative md:inset-auto md:h-auto md:bg-transparent md:dark:bg-transparent md:rounded-none md:shadow-none md:transform-none md:translate-y-0">
                                <div id="stop-list-handle" class="w-full h-8 flex items-center justify-center md:hidden shrink-0 cursor-grab active:cursor-grabbing">
                                    <div class="apple-grabber"></div>
                                </div>
                                <div class="px-4 pb-3 border-b border-black/[0.05] dark:border-white/[0.05] flex gap-2 shrink-0 md:pt-4 md:px-4">
                                    <input type="text" id="stop-search" oninput="debouncedRenderStopGrid()" placeholder="搜尋車站..." class="flex-1 h-10 bg-white dark:bg-[#2C2C2E] text-[15px] px-4 rounded-[10px] outline-none placeholder-gray-400 dark:placeholder-gray-500 shadow-sm md:bg-black/[0.03] md:dark:bg-white/[0.05] md:h-auto md:text-[13px] md:py-2 md:rounded-[12px] md:shadow-none focus:ring-2 ring-apple-accent/50 transition-[background-color,box-shadow]" aria-label="搜尋車站">
                                    <button id="gps-btn" onclick="findNearestStop()" class="w-10 h-10 shrink-0 bg-apple-accent text-white rounded-[10px] hover:bg-apple-accent/90 active:scale-95 transition-[background-color,transform,opacity] shadow-sm flex items-center justify-center disabled:opacity-50 md:w-auto md:h-auto md:p-2 md:rounded-[12px]" title="Find nearest stop" aria-label="定位最近車站">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                        </svg>
                                    </button>
                                </div>
                                <div id="stop-grid" class="flex-1 overflow-y-auto overscroll-contain p-3 space-y-1.5 md:max-h-[60vh] md:p-2 md:space-y-1 custom-scrollbar pb-safe-area" role="listbox" aria-label="車站列表"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="flex-1 space-y-3">
                <div class="flex items-center justify-between px-1">
                    <div class="flex items-center gap-2">
                        <h2 id="arrival-title" class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Arrivals</h2>
                        <span id="selected-stop-name" class="hidden md:inline-block text-[10px] font-semibold text-indigo-600 bg-indigo-50 dark:bg-indigo-900/30 px-2 py-0.5 rounded border border-indigo-100 dark:border-indigo-800">---</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="last-updated" class="text-[10px] font-medium text-slate-400 dark:text-slate-500 tabular-nums">—</span>
                        <button id="past-buses-quick-btn" onclick="toggleShowPastBuses()" class="w-7 h-7 flex items-center justify-center rounded-full text-slate-500 dark:text-slate-400 hover:bg-black/5 dark:hover:bg-white/10 transition-[background-color,opacity,transform] active:scale-90" style="opacity:0.28" aria-label="顯示前班車" title="顯示前班車">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="bus-list" class="bus-card-grid" aria-live="polite" aria-label="到站資訊"></div>
            </section>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="fixed inset-0 z-[110] hidden items-center justify-center" role="dialog" aria-modal="true" aria-label="設定面板">
        <div id="settings-backdrop" class="absolute inset-0 bg-black/40 dark:bg-black/60 opacity-0" onclick="toggleSettings()"></div>
            <div id="settings-card" class="relative bg-[#F2F2F7] dark:bg-[#1C1C1E] rounded-[28px] shadow-2xl w-[90vw] max-w-[420px] overflow-hidden border border-black/5 dark:border-white/10 transform scale-95 opacity-0 transition-[transform,opacity] duration-500">
            <div class="px-6 pt-6 pb-4 border-b border-black/5 dark:border-white/5">
                <div class="flex items-center justify-between">
                    <h2 class="text-[22px] font-extrabold tracking-tight text-slate-900 dark:text-white" data-i18n="settings">設定</h2>
                    <button onclick="toggleSettings()" class="w-9 h-9 bg-black/5 dark:bg-white/10 hover:bg-black/10 dark:hover:bg-white/20 rounded-full flex items-center justify-center transition-[background-color,transform] active:scale-90" aria-label="關閉設定">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-600 dark:text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="px-6 py-5 space-y-5 max-h-[70vh] overflow-y-auto custom-scrollbar">
                <div class="space-y-3">
                    <h3 class="text-[11px] font-bold text-slate-400 uppercase tracking-widest" data-i18n="appearance">外觀</h3>
                    <div class="flex items-center justify-between py-3 px-4 bg-white dark:bg-[#2C2C2E] rounded-[16px]">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-[10px] flex items-center justify-center">
                                <svg id="settings-theme-icon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"></svg>
                            </div>
                            <span class="text-[15px] font-semibold text-slate-900 dark:text-white" data-i18n="theme">深色模式</span>
                        </div>
                        <button onclick="toggleDarkMode(); updateSettingsUI()" class="relative w-[51px] h-[31px] rounded-full transition-colors duration-300" id="theme-toggle-btn" role="switch" aria-checked="false" aria-label="切換深色模式">
                            <div class="absolute top-[2px] left-[2px] w-[27px] h-[27px] bg-white rounded-full shadow-md transition-transform duration-300" id="theme-toggle-knob"></div>
                        </button>
                    </div>
                    <div class="flex items-center justify-between py-3 px-4 bg-white dark:bg-[#2C2C2E] rounded-[16px]">
                        <div class="flex items-center gap-3">

        function t(key) { return i18n[lang]?.[key] || key; }
        const ariaRouteDetails = (id) => lang === 'zh' ? `路線 ${id} 詳情` : `Route ${id} details`;

        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = deg2rad(lat2 - lat1);
            const dLon = deg2rad(lon2 - lon1);
            const a = Math.sin(dLat / 2) ** 2 + Math.cos(deg2rad(lat1)) * Math.cos(deg2rad(lat2)) * Math.sin(dLon /
                2) ** 2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        function deg2rad(deg) { return deg * (Math.PI / 180); }

        function calcDiffMinutes(arrivalStr, currentTotalMinutes) {
            const [h, m] = arrivalStr.split(':').map(Number);
            const total = h * 60 + m;
            let diff = total - currentTotalMinutes;
            if (diff < -720) diff += 1440;
            else if (diff > 720) diff -= 1440;
            return diff;
        }

        function getNow() {
            const timeSource = testTime || mockTime;
            if (!timeSource) return new Date();
            const [h, m] = timeSource.split(':');
            const d = new Date();
            if (testDay !== null) {
                const currentDay = d.getDay();
                d.setDate(d.getDate() + (testDay - currentDay));
            }
            d.setHours(parseInt(h), parseInt(m), 0, 0);
            if (!isTestTimeFixed && testTimeSetAt) {
                return new Date(d.getTime() + (Date.now() - testTimeSetAt));
            }
            return d;
        }

        function saveSettings() {
            try {
                localStorage.setItem(SETTINGS_KEY, JSON.stringify({

                    lang,
                    isDark,
                    mode: currentMode,

                    testTime,
                    testDay,
                    isDevMode,
                    showPastBuses,
                    isTestTimeFixed
                }));
            } catch (e) {
                console.warn('[CU BUS] Failed to save settings:', e);
            }
        }

        function updateToggleButton(btnId, knobId, isActive) {
            const btn = document.getElementById(btnId);
            const knob = document.getElementById(knobId);
            if (!btn || !knob) return;
            btn.className =

            knob.style.transform = isActive ? 'translateX(20px)' : 'translateX(0)';
            btn.setAttribute('aria-checked', isActive);
        }

        function updateI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang]?.[key]) el.textContent = i18n[lang][key];
            });
        }

        function updateStopLabels() {
            const stop = db.stops.find(s => s.id === currentStopId);
            const name = stop ? (lang === 'zh' ? stop.name_zh : stop.name_en) : '---';
            document.getElementById('mobile-current-stop').innerText = name;
            document.getElementById('selected-stop-name').innerText = name;
            document.getElementById('arrival-title').innerText = t('arrival');
        }

        function updateLocatingStatus(isLocating) {
            const btn = document.getElementById('gps-btn');
            const mobileDot = document.getElementById('mobile-status-dot');
            if (btn) {
                btn.classList.toggle('animate-spin', isLocating);
                btn.disabled = isLocating;
            }
            if (mobileDot) {
                mobileDot.classList.toggle('locating-spinner', isLocating);
            }
        }

        const ScheduleEngine = {
            timeToMins: (timeStr) => {
                if (!timeStr) return 0;
                const [h, m] = timeStr.split(':').map(Number);
                return h * 60 + m;
            },
            initRouteTimes: () => {
                if (!db.routes) return {};
                const times = {};
                db.routes.forEach(r => {
                    times[r.id] = {
                        starttime: (r.open_time || '00:00').substring(0, 5),
                        endtime: (r.close_time || '23:59').substring(0, 5),
                        frequency: 'Check Sched'
                    };
                });
                return times;
            },
            getArrivals: (nowDate) => {
                if (!db.routes || !db.segments || !db.stops) return [];
                const currentMins = nowDate.getHours() * 60 + nowDate.getMinutes();
                const isSaturday = nowDate.getDay() === 6;
                const arrivals = [];
                const stopMap = db.stopMap;

                const segmentsByRoute = Object.keys(db.segmentsByRoute).length > 0 ?
                    db.segmentsByRoute :
                    db.segments.reduce((map, s) => {
                        if (!map[s.route_id]) map[s.route_id] = [];
                        map[s.route_id].push(s);
                        return map;
                    }, {});

                db.routes.forEach(route => {
                    if (isSaturday && route.operating_day_type.includes('MON_TO_FRI')) return;

                    const openMins = ScheduleEngine.timeToMins(route.open_time);
                    let closeMins = ScheduleEngine.timeToMins(route.close_time);

                    if (isSaturday) {
                        const saturdayCutoff = { '5_cwc': '13:26:00', '6A': '13:10:00', '7': '13:18:00' }[route.id];
                        if (saturdayCutoff) {
                            closeMins = Math.min(closeMins, ScheduleEngine.timeToMins(saturdayCutoff));
                        }
                    }

                    let depMins = route.departure_mins_json;
                    if (typeof depMins === 'string') {
                        try { depMins = JSON.parse(depMins); } catch (e) { depMins = []; }
                    }
                    if (!Array.isArray(depMins)) depMins = [];
                    depMins = depMins.map(Number).filter(m => !isNaN(m));

                    const startHour = Math.floor(openMins / 60);
                    const endHour = Math.floor(closeMins / 60);

                    for (let h = startHour; h <= endHour; h++) {
                        depMins.forEach(m => {
                            const tripStartMins = h * 60 + m;
                            if (tripStartMins < openMins || tripStartMins > closeMins) return;

                            const routeSegments = segmentsByRoute[route.id] || [];
                            const originId = routeSegments[0]?.from_stop_id;
                            if (originId) {
                                let originDiff = tripStartMins - currentMins;
                                if (originDiff < -720) originDiff += 1440;
                                else if (originDiff > 720) originDiff -= 1440;

                                const originPastLimit = showPastBuses ? -30 : -1;
                                if (originDiff >= originPastLimit && originDiff <= 65) {
                                    const arrH = Math.floor(tripStartMins / 60) % 24;
                                    const arrM = tripStartMins % 60;
                                    const timeStr =
                                        `${String(arrH).padStart(2, '0')}:${String(arrM).padStart(2, '0')}`;
                                    const originStop = stopMap[originId];
                                    arrivals.push({
                                        route_id: route.id,
                                        route_name: lang === 'zh' ? route.name_zh : route
                                            .name_en,
                                        stop_id: originId,
                                        stop_name: originStop ? (lang === 'zh' ? originStop
                                            .name_zh : originStop.name_en) : originId,
                                        arrival_time: timeStr,
                                        day_type: route.operating_day_type,
                                        order_seq: tripStartMins,
                                        isPast: originDiff < -1
                                    });
                                }
                            }

                            routeSegments.forEach(seg => {
                                const arrivalMins = tripStartMins + Math.round(seg
                                    .expected_duration_sec / 60);
                                let diff = arrivalMins - currentMins;
                                if (diff < -720) diff += 1440;
                                else if (diff > 720) diff -= 1440;

                                const pastLimit = showPastBuses ? -30 : -1;
                                if (diff >= pastLimit && diff <= 65) {
                                    const arrH = Math.floor(arrivalMins / 60) % 24;
                                    const arrM = arrivalMins % 60;
                                    const timeStr =
                                        `${String(arrH).padStart(2, '0')}:${String(arrM).padStart(2, '0')}`;
                                    const targetStop = stopMap[seg.to_stop_id];
                                    arrivals.push({
                                        route_id: route.id,
                                        route_name: lang === 'zh' ? route.name_zh : route
                                            .name_en,
                                        stop_id: seg.to_stop_id,
                                        stop_name: targetStop ? (lang === 'zh' ? targetStop
                                            .name_zh : targetStop.name_en) : seg.to_stop_id,
                                        arrival_time: timeStr,
                                        day_type: route.operating_day_type,
                                        order_seq: arrivalMins,
                                        isPast: diff < -1
                                    });
                                }
                            });
                        });
                    }
                });
                return arrivals.sort((a, b) => a.order_seq - b.order_seq);
            }
        };

        function renderModeSelector() {
            const modes = ['weekday', 'nonteaching', 'sunday'];
            const container = document.getElementById('mode-selector');
            if (!container) return;
            container.innerHTML = modes.map(m => `
                <button onclick="changeMode('${m}')" class="flex-1 py-1.5 text-[10px] sm:text-[12px] font-semibold rounded-[9px] transition-[background-color,color,box-shadow] duration-300 ${currentMode === m ? 'bg-white dark:bg-[#3A3A3C] text-black dark:text-white shadow-sm' : 'text-slate-500 hover:text-slate-900 dark:hover:text-slate-300'}" role="tab" aria-selected="${currentMode === m}">
                    ${t(m)}
                </button>
            `).join('');
        }

        function debouncedRenderStopGrid() {
            if (renderStopGridTimer) clearTimeout(renderStopGridTimer);
            renderStopGridTimer = setTimeout(() => {
                renderStopGrid();
                renderStopGridTimer = null;
            }, 120);
        }

        function renderStopGrid() {
            const query = (document.getElementById('stop-search')?.value || '').toLowerCase();
            const container = document.getElementById('stop-grid');
            if (!container) return;

            const now = getNow();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const safeArrivals = db.arrivals || [];

            const stopRoutesMap = {};
            safeArrivals.forEach(arr => {
                if (!stopRoutesMap[arr.stop_id]) stopRoutesMap[arr.stop_id] = new Set();
                stopRoutesMap[arr.stop_id].add((arr.route_name || '').toLowerCase());
            });

            const busCounts = {};
            safeArrivals.forEach(arr => {
                const dt = arr.day_type || "";
                let isMatch = false;
                if (currentMode === 'weekday') isMatch = dt.includes('MON') || dt === 'N' || dt === '';
                else if (currentMode === 'nonteaching') isMatch = dt.includes('MON') && !dt.includes('TEACHING');
                else if (currentMode === 'sunday') isMatch = dt.includes('SUN') || dt.includes('HOLIDAY') || dt ===
                    'N';
                if (!isMatch) return;
                const diff = calcDiffMinutes(arr.arrival_time, currentMinutes);
                if (diff >= -1 && diff <= 60) {
                    busCounts[arr.stop_id] = (busCounts[arr.stop_id] || 0) + 1;
                }
            });

            let filteredStops = db.stops.filter(s => {
                const nameMatch = s.name_zh.toLowerCase().includes(query) || s.name_en.toLowerCase().includes(
                    query);
                const routeMatch = stopRoutesMap[s.id] && [...stopRoutesMap[s.id]].some(r => r.includes(query));
                return nameMatch || routeMatch;
            });

            const posChanged = userPos && (!lastUserPos || lastUserPos.lat !== userPos.lat || lastUserPos.lng !== userPos
                .lng);
            if (posChanged) {
                lastUserPos = { lat: userPos.lat, lng: userPos.lng };
                db.stops.forEach(s => {
                    const sLng = (s.lng !== undefined) ? s.lng : s.long;
                    s._cachedDist = (s.lat && sLng) ? getDistanceFromLatLonInKm(userPos.lat, userPos.lng, s.lat,
                        sLng) : null;
                });
            }
            filteredStops = filteredStops.map(s => ({ ...s, distance: userPos ? (s._cachedDist ?? null) : null }));

            filteredStops.sort((a, b) => {
                const countA = busCounts[a.id] || 0;
                const countB = busCounts[b.id] || 0;
                const hasBusA = countA > 0 ? 1 : 0;
                const hasBusB = countB > 0 ? 1 : 0;
                if (hasBusA !== hasBusB) return hasBusB - hasBusA;
                const distA = a.distance !== null ? a.distance : 9999;
                const distB = b.distance !== null ? b.distance : 9999;
                return distA - distB;
            });

            if (filteredStops.length === 0 && query !== "") {
                container.innerHTML =
                    `<div class="py-8 text-center text-slate-400 text-xs">${t('noStopsFound')}</div>`;
                stopGridStates.clear();
                return;
            }

            const newKeys = new Set();
            const frag = document.createDocumentFragment();
            filteredStops.forEach(stop => {
                newKeys.add(stop.id);
                const count = busCounts[stop.id] || 0;
                const isSelected = currentStopId === stop.id;
                const hasBuses = count > 0;
                const badgeClass = count > 0 ?
                    (isSelected ? 'bg-white/30 text-white' :
                        'bg-apple-accent/10 text-apple-accent dark:bg-apple-accent/20') :
                    'bg-slate-200/60 text-slate-400 dark:bg-slate-700/40 dark:text-slate-500';
                const distLabel = stop.distance ?
                    `<span class="text-[10px] font-semibold opacity-50 tracking-tight">${stop.distance < 1 ? Math.round(stop.distance * 1000) + ' m' : stop.distance.toFixed(1) + ' km'}</span>` :
                    '';
                const name = lang === 'zh' ? stop.name_zh : stop.name_en;
                const data = { stop, count, isSelected, hasBuses, badgeClass, distLabel, name };

                const existing = stopGridStates.get(stop.id);
                if (existing) {
                    updateStopItem(existing, data);
                    frag.appendChild(existing.btn);
                } else {
                    const state = createStopItem(data);
                    stopGridStates.set(stop.id, state);
                    frag.appendChild(state.btn);
                }
            });

            for (const [key, state] of stopGridStates) {
                if (!newKeys.has(key)) {
                    state.btn.remove();
                    stopGridStates.delete(key);
                }
            }

            container.innerHTML = '';
            container.appendChild(frag);
        }

        function createStopItem(data) {
            const { stop, count, isSelected, hasBuses, badgeClass, distLabel, name } = data;
            const btn = document.createElement('button');
            btn.setAttribute('data-stop-id', stop.id);
            btn.setAttribute('onclick', `setStop('${stop.id}', true)`);
            btn.setAttribute('role', 'option');
            btn.setAttribute('aria-selected', String(isSelected));
            btn.className = `w-full px-5 py-3 rounded-[16px] text-[15px] font-semibold text-left transition-[background-color,color,box-shadow,transform] flex items-center justify-between group ${isSelected ? 'bg-apple-accent text-white shadow-lg scale-[1.02]' : (hasBuses ? 'text-slate-900 dark:text-white' : 'text-slate-400 dark:text-slate-600')} hover:bg-black/[0.04] dark:hover:bg-white/[0.06] mb-1`;
            btn.innerHTML = `
                <div class="flex flex-col truncate pr-2">
                    <span data-stop-name class="truncate leading-tight">${name}</span>
                    <div data-stop-dist class="mt-0.5">${distLabel}</div>
                </div>
                <span data-stop-badge class="shrink-0 font-mono text-[10px] px-2 py-0.5 rounded-full transition-colors ${badgeClass}">${count}</span>`;

            const nameEl = btn.querySelector('[data-stop-name]');
            const distEl = btn.querySelector('[data-stop-dist]');
            const badgeEl = btn.querySelector('[data-stop-badge]');
            return {
                btn, nameEl, distEl, badgeEl,
                lastName: name, lastDist: distLabel, lastBadge: badgeClass, lastClassName: btn.className, lastCount: count
            };
        }

        function updateStopItem(state, data) {
            const { count, isSelected, hasBuses, badgeClass, distLabel, name } = data;

            if (name !== state.lastName) {
                state.nameEl.textContent = name;
                state.lastName = name;
            }
            if (distLabel !== state.lastDist) {
                state.distEl.innerHTML = distLabel;
                state.lastDist = distLabel;
            }
            if (count !== state.lastCount) {
                state.badgeEl.textContent = String(count);
                state.lastCount = count;
            }
            if (badgeClass !== state.lastBadge) {
                state.badgeEl.className = `shrink-0 font-mono text-[10px] px-2 py-0.5 rounded-full transition-colors ${badgeClass}`;
                state.lastBadge = badgeClass;
            }
            const newClassName = `w-full px-5 py-3 rounded-[16px] text-[15px] font-semibold text-left transition-[background-color,color,box-shadow,transform] flex items-center justify-between group ${isSelected ? 'bg-apple-accent text-white shadow-lg scale-[1.02]' : (hasBuses ? 'text-slate-900 dark:text-white' : 'text-slate-400 dark:text-slate-600')} hover:bg-black/[0.04] dark:hover:bg-white/[0.06] mb-1`;
            if (newClassName !== state.lastClassName) {
                state.btn.className = newClassName;
                state.lastClassName = newClassName;
            }
            if (state.btn.getAttribute('aria-selected') !== String(isSelected)) {
                state.btn.setAttribute('aria-selected', String(isSelected));
            }
        }

        function renderTimeline(bus) {
            if (!db.segments || db.segments.length === 0) return '';
            const steps = db.segments
                .filter(t => t.route_id === bus.route_id)
                .sort((a, b) => a.expected_duration_sec - b.expected_duration_sec);
            if (steps.length === 0) return '';

            let timelineStops = [];
            const addedSet = new Set();
            if (steps[0].from_stop_id) {
                timelineStops.push({ stopId: steps[0].from_stop_id, seconds: 0 });
                addedSet.add(steps[0].from_stop_id);
            }
            steps.forEach(s => {
                if (!addedSet.has(s.to_stop_id)) {
                    timelineStops.push({ stopId: s.to_stop_id, seconds: s.expected_duration_sec });
                    addedSet.add(s.to_stop_id);
                }
            });

            const currentIndex = timelineStops.findIndex(s => s.stopId === bus.stop_id);
            if (currentIndex === -1) return '';

            const currentStopData = timelineStops[currentIndex];
            const baseSeconds = currentStopData.seconds;
            const baseDate = getNow();
            const [h, m] = bus.arrival_time.split(':').map(Number);
            const arrivalDate = new Date(baseDate);
            arrivalDate.setHours(h, m, 0, 0);

            const timelineHTML = timelineStops.map((point, index) => {
                const sObj = db.stopMap[point.stopId];
                const stopName = sObj ? (lang === 'zh' ? sObj.name_zh : sObj.name_en) : point.stopId;
                const diffSec = point.seconds - baseSeconds;
                const pointDate = new Date(arrivalDate.getTime() + diffSec * 1000);
                const timeStr = pointDate.toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit',
                    hour12: false });

                let state = 'future';
                if (index < currentIndex) state = 'past';
                else if (index === currentIndex) state = 'current';

                let rowClass = "flex items-center gap-4 relative py-3 min-h-[44px]";
                let dotHTML = "",
                    textClass = "",
                    timeClass = "",
                    uniqueId = "";

                if (state === 'past') {
                    dotHTML =
                        `<div class="w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600 z-10"></div>`;
                    textClass =
                        "text-[13px] font-medium text-slate-400 dark:text-slate-500 opacity-60";
                    timeClass =
                        "text-[11px] font-mono text-slate-300 dark:text-slate-600 opacity-60";
                } else if (state === 'current') {
                    const tripId = `${bus.route_id}-${bus.stop_id}-${bus.arrival_time}`;
                    uniqueId = `id="current-node-${tripId}"`;
                    dotHTML = `<div class="apple-puck z-10"></div>`;
                    textClass = "text-[15px] font-bold text-slate-900 dark:text-white";
                    timeClass =
                        "text-[12px] font-mono font-bold text-apple-accent bg-blue-50 dark:bg-blue-900/30 px-1.5 py-0.5 rounded";
                } else {
                    dotHTML =
                        `<div class="w-2.5 h-2.5 rounded-full bg-white dark:bg-slate-800 border-[2px] border-slate-300 dark:border-slate-500 z-10"></div>`;
                    textClass = "text-[13px] font-medium text-slate-700 dark:text-slate-300";
                    timeClass = "text-[11px] font-mono text-slate-500 dark:text-slate-400";
                }

                return `
                    <div class="${rowClass} group" ${uniqueId}>
                        <div class="w-[14px] flex justify-center shrink-0">${dotHTML}</div>
                        <div class="flex-1 flex justify-between items-baseline pr-2">
                            <span class="${textClass} transition-colors leading-snug">${stopName}</span>
                            <span class="${timeClass} tabular-nums tracking-tight ml-3">${timeStr}</span>
                        </div>
                    </div>`;
            }).join('');

            return `
                <div class="mt-4 relative">
                    <div class="absolute top-0 bottom-0 left-[26px] w-[2px] bg-slate-100 dark:bg-slate-800/50 rounded-full"></div>
                    <div class="timeline-scroll-container max-h-[240px] overflow-y-auto px-5 py-2 timeline-mask space-y-0 relative">
                        ${timelineHTML}
                    </div>
                </div>`;
        }

        function processAndRender() {
            const listDiv = document.getElementById('bus-list');
            if (!currentStopId || db.stops.length === 0) {
                if (db.stops.length === 0 && listDiv) {
                    listDiv.innerHTML =
                        `<div class="col-span-full py-12 text-center text-slate-400 text-xs font-medium">${t('loading')}</div>`;
                }
                cardStates.clear();
                return;
            }

            const now = getNow();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            const filtered = db.arrivals.reduce((acc, arr) => {
                if (arr.stop_id !== currentStopId) return acc;
                const dt = arr.day_type || "";
                let isMatch = false;
                if (currentMode === 'weekday') isMatch = dt.includes('MON') || dt === 'N' || dt === '';
                else if (currentMode === 'nonteaching') isMatch = dt.includes('MON') && !dt.includes('TEACHING');
                else if (currentMode === 'sunday') isMatch = dt.includes('SUN') || dt.includes('HOLIDAY') || dt ===
                    'N';
                if (!isMatch) return acc;
                const diff = calcDiffMinutes(arr.arrival_time, currentMinutes);
                const pastLimit = showPastBuses ? -30 : -1;
                if (diff >= pastLimit && diff <= 65) acc.push({ ...arr, diff });
                return acc;
            }, []).sort((a, b) => a.diff - b.diff);

            if (filtered.length === 0) {
                listDiv.innerHTML =
                    `<div class="col-span-full py-12 text-center text-slate-400 text-xs font-medium border-2 border-dashed border-slate-200 dark:border-slate-800 rounded-2xl">${t('empty')}</div>`;
                cardStates.clear();
                return;
            }

            let savedScrollTop = 0;
            if (expandedTripId) {
                const activeContainer = listDiv.querySelector('.timeline-scroll-container');
                if (activeContainer) savedScrollTop = activeContainer.scrollTop;
            }

            const newKeys = new Set();
            const frag = document.createDocumentFragment();
            filtered.forEach(bus => {
                const routeMatch = bus.route_name.match(/^[0-9A-Z]+/i);
                const routeDisp = routeMatch ? routeMatch[0] : bus.route_name.split(' ')[0];
                const tripId = `${bus.route_id}-${bus.stop_id}-${bus.arrival_time}`;
                newKeys.add(tripId);

                let statusCls =
                    'text-emerald-600 bg-emerald-50 dark:bg-emerald-900/20 border-emerald-100 dark:border-emerald-800/30';
                let timeLabel = t('unit'),
                    displayDiff = bus.diff;

                if (bus.isPast && bus.diff < -1) {
                    statusCls =
                        'text-slate-400 bg-slate-100 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700/50';
                    timeLabel = t('pastMinLabel');
                    displayDiff = Math.abs(bus.diff);
                } else if (bus.diff <= 0) {
                    statusCls =
                        'text-slate-400 bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700';
                    timeLabel = t('arrived');
                    displayDiff = '--';
                } else if (bus.diff <= 5) {
                    statusCls =
                        'text-rose-600 bg-rose-50 dark:bg-rose-900/20 border-rose-100 dark:border-rose-800/30 font-bold';
                    timeLabel = t('soon');
                }

                const isPastCard = bus.isPast && bus.diff < -1;
                const isExpanded = expandedTripId === tripId;
                const data = { tripId, bus, routeDisp, statusCls, displayDiff, timeLabel, isPastCard, isExpanded };

                const existing = cardStates.get(tripId);
                if (existing) {
                    updateBusCard(existing, data);
                    frag.appendChild(existing.card);
                } else {
                    const state = createBusCard(data);
                    cardStates.set(tripId, state);
                    frag.appendChild(state.card);
                }
            });

            for (const [key, state] of cardStates) {
                if (!newKeys.has(key)) {
                    state.card.remove();
                    cardStates.delete(key);
                }
            }

            listDiv.innerHTML = '';
            listDiv.appendChild(frag);

            if (expandedTripId && savedScrollTop > 0) {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        const newContainer = listDiv.querySelector('.timeline-scroll-container');
                        if (newContainer) {
                            newContainer.scrollTop = savedScrollTop;
                            newContainer.style.scrollBehavior = 'auto';
                            setTimeout(() => { newContainer.style.scrollBehavior = 'smooth'; }, 50);
                        }
                    });
                });
            }
        }

        function createBusCard(data) {
            const { tripId, bus, routeDisp, statusCls, displayDiff, timeLabel, isPastCard, isExpanded } = data;

            const card = document.createElement('div');
            card.setAttribute('data-arrival-time', bus.arrival_time);
            card.setAttribute('data-trip-id', tripId);
            card.setAttribute('data-is-past', String(isPastCard));
            card.setAttribute('onclick', `toggleTripDetails('${tripId}')`);
            card.className = `apple-card rounded-[24px] px-5 py-5 cursor-pointer active:scale-[0.98]${isExpanded ? ' ring-2 ring-apple-accent/20 border-apple-accent/30' : ''}${isPastCard ? ' opacity-50' : ''}`;

            card.innerHTML = `
                <div class="flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div onclick="openRouteDetails('${bus.route_id}', event)" class="w-12 h-12 shrink-0 bg-black dark:bg-white rounded-[14px] flex items-center justify-center text-white dark:text-black font-black text-sm shadow-apple hover:scale-110 active:scale-90 transition-transform z-10 relative" role="button" tabindex="0" aria-label="${ariaRouteDetails(routeDisp)}">${routeDisp}</div>
                        <div class="flex flex-col">
                            <span class="text-[19px] font-extrabold tracking-tight text-slate-900 dark:text-white leading-none">${bus.arrival_time.split(':').slice(0, 2).join(':')}</span>
                        </div>
                    </div>
                    <div data-status class="px-4 py-2 rounded-[16px] ${statusCls} text-center min-w-[70px]">
                        <div class="countdown-value text-lg font-black leading-none">${displayDiff}</div>
                        <div class="countdown-label text-[9px] font-bold uppercase mt-1 opacity-70">${timeLabel}</div>
                    </div>
                </div>`;

            if (isExpanded) {
                const tl = document.createElement('div');
                tl.setAttribute('data-timeline', '');
                tl.className = 'mt-4 px-1 animate-in fade-in slide-in-from-top-2 duration-300';
                tl.innerHTML = renderTimeline(bus);
                card.appendChild(tl);
            }

            const diffEl = card.querySelector('.countdown-value');
            const labelEl = card.querySelector('.countdown-label');
            const statusEl = card.querySelector('[data-status]');
            const timelineEl = card.querySelector('[data-timeline]');

            return {
                card, arrivalTime: bus.arrival_time, isPast: isPastCard,
                diffEl, labelEl, statusEl, timelineEl,
                lastValue: String(displayDiff), lastLabel: timeLabel
            };
        }

        function updateBusCard(state, data) {
            const { bus, statusCls, displayDiff, timeLabel, isPastCard, isExpanded } = data;

            if (state.isPast !== isPastCard) {
                state.isPast = isPastCard;
                state.card.setAttribute('data-is-past', String(isPastCard));
            }

            const newValue = String(displayDiff);
            if (newValue !== state.lastValue) {
                state.diffEl.textContent = newValue;
                state.lastValue = newValue;
            }
            if (timeLabel !== state.lastLabel) {
                state.labelEl.textContent = timeLabel;
                state.lastLabel = timeLabel;
            }

            state.statusEl.className = `px-4 py-2 rounded-[16px] ${statusCls} text-center min-w-[70px]`;
            state.card.classList.toggle('opacity-50', isPastCard);
            state.card.classList.toggle('ring-2', isExpanded);
            state.card.classList.toggle('ring-apple-accent/20', isExpanded);
            state.card.classList.toggle('border-apple-accent/30', isExpanded);

            if (isExpanded) {
                if (state.timelineEl) {
                    state.timelineEl.innerHTML = renderTimeline(bus);
                } else {
                    const tl = document.createElement('div');
                    tl.setAttribute('data-timeline', '');
                    tl.className = 'mt-4 px-1 animate-in fade-in slide-in-from-top-2 duration-300';
                    tl.innerHTML = renderTimeline(bus);
                    state.card.appendChild(tl);
                    state.timelineEl = tl;
                }
            } else if (state.timelineEl) {
                state.timelineEl.remove();
                state.timelineEl = null;
            }
        }

        function tickCountdownOnly(now = getNow(), currentMinutes = now.getHours() * 60 + now.getMinutes()) {
            const tickPastLimit = showPastBuses ? -30 : -1;
            let needsFullRender = false;
            const minuteChanged = currentMinutes !== lastRenderMinute;
            if (cardStates.size === 0) return;

            for (const state of cardStates.values()) {
                const diff = calcDiffMinutes(state.arrivalTime, currentMinutes);
                let newValue, newLabel;
                if (state.isPast) {
                    newValue = String(Math.abs(diff));
                    newLabel = t('pastMinLabel');
                } else if (diff <= 0) {
                    newValue = '--';
                    newLabel = t('arrived');
                } else if (diff <= 5) {
                    newValue = String(diff);
                    newLabel = t('soon');
                } else {
                    newValue = String(diff);
                    newLabel = t('unit');
                }
                if (newValue !== state.lastValue) {
                    state.diffEl.textContent = newValue;
                    state.lastValue = newValue;
                }
                if (newLabel !== state.lastLabel) {
                    state.labelEl.textContent = newLabel;
                    state.lastLabel = newLabel;
                }
                if (diff < tickPastLimit || diff > 65) {
                    needsFullRender = true;
                }
            }

            if (minuteChanged || needsFullRender) {
                lastRenderMinute = currentMinutes;
                processAndRender();
            }
        }

        function loadData(isAutoRefresh = false) {
            refreshTimer = 0;
            const ring = document.getElementById('refresh-ring');
            if (ring) {
                ring.style.transition = 'none';
                ring.style.strokeDashoffset = '100';
                void ring.offsetWidth;
                ring.style.transition = 'stroke-dashoffset 1s linear';
            }

            if (fetchController) fetchController.abort();
            fetchController = new AbortController();
            const signal = fetchController.signal;

            const btn = document.getElementById('refresh-btn');
            if (!isAutoRefresh && btn) {
                btn.classList.remove('animate-apple-spin');
                void btn.offsetWidth;
                btn.classList.add('animate-apple-spin');
                setTimeout(() => btn.classList.remove('animate-apple-spin'), 800);
            }

            if (db.stops.length === 0) {
                const listDiv = document.getElementById('bus-list');
                if (listDiv) {
                    listDiv.innerHTML = Array(4).fill(0).map(() =>
                        `<div class="h-20 rounded-2xl skeleton-pulse"></div>`
                    ).join('');
                }
            }

            const fetchJson = async (url) => {
                const res = await fetch(url, { signal });
                if (!res.ok) throw new Error(`Failed to fetch ${url}: ${res.status}`);
                const data = await res.json();
                if (!Array.isArray(data)) throw new Error(`Invalid format for ${url}`);
                return data;
            };

            Promise.all([
                db.stops.length === 0 ? fetchJson('stop.json') : Promise.resolve(null),
                db.routes.length === 0 ? fetchJson('route.json') : Promise.resolve(null),
                db.segments.length === 0 ? fetchJson('route_segment.json') : Promise.resolve(null)
            ]).then(([stopRes, routeRes, segRes]) => {
                if (stopRes) {
                    db.stops = stopRes.map(s => ({ ...s, lng: s.lng ?? s.long ?? null }));
                    db.stopMap = {};
                    db.stops.forEach(s => db.stopMap[s.id] = s);
                }
                if (routeRes) db.routes = routeRes;
                if (segRes) {
                    db.segments = segRes;
                    db.segmentsByRoute = segRes.reduce((map, s) => {
                        if (!map[s.route_id]) map[s.route_id] = [];
                        map[s.route_id].push(s);
                        return map;
                    }, {});
                    Object.values(db.segmentsByRoute).forEach(segs =>
                        segs.sort((a, b) => a.expected_duration_sec - b.expected_duration_sec)
                    );
                }

                if (!Array.isArray(db.stops) || !Array.isArray(db.routes)) {
                    throw new Error('Invalid JSON format');
                }

                db.route_times = ScheduleEngine.initRouteTimes();
                db.arrivals = ScheduleEngine.getArrivals(getNow()) || [];

                if (!currentStopId && db.stops.length > 0) {
                    currentStopId = db.stops[0].id;
                }
                updateStopLabels();

                if (isFirstLoad) {
                    findNearestStop(true);
                }

                lastUpdatedAt = Date.now();
                updateLastUpdated();

                if (!isFirstLoad && !isAutoRefresh && navigator.vibrate) navigator.vibrate(10);

                if (isFirstLoad) {
                    isFirstLoad = false;
                    renderAll(true);
                } else {
                    tickCountdownOnly();
                }
            }).catch(e => {
                if (e.name !== 'AbortError') {
                    console.error('[CU BUS] Data load error:', e);
                    const listDiv = document.getElementById('bus-list');
                    if (listDiv) {
                        listDiv.innerHTML =
                            `<div class="col-span-full p-6 text-center text-red-500 bg-red-50 dark:bg-red-900/20 rounded-2xl text-sm font-medium">${t('loadError')}<br><span class="text-xs opacity-70 mt-1 block">${e.message}</span><br><button onclick="loadData()" class="mt-3 px-4 py-1.5 bg-red-500 text-white text-xs rounded-full hover:bg-red-600 transition-colors">${t('retry')}</button></div>`;
                    }
                }
            });
        }

        function findNearestStop(silent = false) {
            if (db.stops.length === 0) return;
            if (!navigator.geolocation) {
                if (!silent) alert(t('noGpsSupport'));
                return;
            }
            updateLocatingStatus(true);
            let gotFix = false;

            const handleCoords = (position, isHighRes) => {
                if (gotFix) return;
                gotFix = true;
                updateLocatingStatus(false);

                const { latitude, longitude } = position.coords;
                userPos = { lat: latitude, lng: longitude };

                let minDistance = Infinity,
                    nearestId = null;
                db.stops.forEach(stop => {
                    const sLng = stop.lng ?? stop.long;
                    if (stop.lat && sLng) {
                        const d = getDistanceFromLatLonInKm(latitude, longitude, stop.lat, sLng);
                        if (d < minDistance) { minDistance = d;
                            nearestId = stop.id; }
                    }
                });

                if (nearestId) {
                    if (autoSwitchStop) currentStopId = nearestId;
                    renderAll(true);
                    if (!silent && window.innerWidth < 768 && autoSwitchStop) toggleStopList(false);
                    if (isHighRes && navigator.vibrate && autoSwitchStop) navigator.vibrate(50);
                }
            };

            navigator.geolocation.getCurrentPosition(
                pos => handleCoords(pos, false),
                e => console.log('Low accuracy GPS failed', e),
                { timeout: 3000, maximumAge: 60000, enableHighAccuracy: false }
            );
            navigator.geolocation.getCurrentPosition(
                pos => handleCoords(pos, true),
                err => {
                    if (gotFix) {
                        console.warn('High accuracy GPS failed', err);
                    } else {
                        if (!silent) alert(t('gpsError'));
                        updateLocatingStatus(false);
                    }
                },
                { timeout: 10000, maximumAge: 0, enableHighAccuracy: true }
            );
        }

        function initBottomSheet(sheetId, handleId, closeFn) {
            const sheet = document.getElementById(sheetId);
            if (!sheet || window.innerWidth >= 768) return;
            const scrollContent = sheet.querySelector('.overflow-y-auto');
            if (!scrollContent) return;

            let startY = 0,
                currentTranslateY = 0,
                isDragging = false;

            const onTouchStart = (e) => { startY = e.touches[0].clientY; };
            const onTouchMove = (e) => {
                const touchY = e.touches[0].clientY;
                const isAtTop = scrollContent.scrollTop <= 0;
                let deltaY = touchY - startY;

                if (isAtTop && deltaY > 0) {
                    if (!isDragging) {
                        isDragging = true;
                        startY = touchY;
                        deltaY = 0;
                        sheet.classList.add('dragging');
                    }
                    if (e.cancelable) e.preventDefault();
                    currentTranslateY = deltaY;
                    sheet.style.transform = `translateY(${currentTranslateY}px)`;
                } else if (isDragging && deltaY <= 0) {
                    if (currentTranslateY > 0) {
                        if (e.cancelable) e.preventDefault();
                        currentTranslateY = Math.max(0, deltaY + currentTranslateY);
                        sheet.style.transform = `translateY(${currentTranslateY}px)`;
                    } else {
                        isDragging = false;
                        sheet.classList.remove('dragging');
                        sheet.style.transform = '';
                    }
                }
            };
            const onTouchEnd = (e) => {
                if (!isDragging) return;
                const deltaY = e.changedTouches[0].clientY - startY;
                isDragging = false;
                sheet.classList.remove('dragging');
                sheet.style.transform = '';
                if (deltaY > 100) closeFn();
            };

            sheet.addEventListener('touchstart', onTouchStart, { passive: true });
            sheet.addEventListener('touchmove', onTouchMove, { passive: false });
            sheet.addEventListener('touchend', onTouchEnd);
        }

        function updateClock(now = getNow()) {

            }
            document.getElementById('current-time').innerText = now.toLocaleTimeString('zh-HK', { hour12: false });
            const timeEl = document.getElementById('current-time');
            const dateEl = document.getElementById('current-date');
            const isSimulated = !!(testTime || mockTime);
            timeEl.classList.toggle('text-orange-500', isSimulated);
            timeEl.classList.toggle('text-slate-400', !isSimulated);
            dateEl.classList.toggle('text-orange-400', isSimulated);
            dateEl.classList.toggle('text-slate-500', !isSimulated);
            const dateKey = now.toDateString() + '|' + lang;
            if (dateKey !== cachedDateKey) {
                cachedDateKey = dateKey;
                cachedDateString = now.toLocaleDateString(lang === 'zh' ? 'zh-HK' : 'en-GB', { weekday: 'short',
                    day: 'numeric', month: 'short' }).toUpperCase();
                dateEl.innerText = cachedDateString;
            }
        }

        function updateRefreshUI() {
            if (refreshTimer < REFRESH_INTERVAL) {
                refreshTimer++;
                const ring = document.getElementById('refresh-ring');
                if (ring) {
                    if (ring.style.transition === 'none') ring.style.transition = 'stroke-dashoffset 1s linear';
                    const offset = 100 - Math.min((refreshTimer / REFRESH_INTERVAL) * 100, 100);
                    ring.style.strokeDashoffset = offset;
                }
            } else {
                loadData(true);
            }
        }

        function updateLastUpdated() {
            const el = document.getElementById('last-updated');
            if (!el) return;
            if (!lastUpdatedAt) {
                if (lastUpdatedTextCache !== '—') {
                    el.textContent = '—';
                    lastUpdatedTextCache = '—';
                }
                return;
            }
            const diff = Math.max(0, Math.floor((Date.now() - lastUpdatedAt) / 1000));
            let text;
            if (diff < 5) text = t('updatedJustNow');
            else if (diff < 60) text = lang === 'zh' ? `${diff} ${t('updatedSecondsAgo')}` : `${diff}${t('updatedSecondsAgo')}`;
            else {
                const mins = Math.floor(diff / 60);
                text = lang === 'zh' ? `${mins} ${t('updatedMinutesAgo')}` : `${mins}${t('updatedMinutesAgo')}`;
            }
            if (text !== lastUpdatedTextCache) {
                el.textContent = text;
                lastUpdatedTextCache = text;
            }
        }

        function tick() {
            const now = getNow();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            updateClock(now);
            updateRefreshUI();
            updateLastUpdated();
            if (db.stops.length > 0) tickCountdownOnly(now, currentMinutes);
            setTimeout(tick, 1000 - (Date.now() % 1000));
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateThemeIcon();
            updateI18n();
            updateClock();
            renderModeSelector();
            loadData();
            setTimeout(tick, 1000 - (Date.now() % 1000));
            initBottomSheet('stop-list-sheet', 'stop-list-handle', () => toggleStopList(false));
            initBottomSheet('route-modal-card', 'route-modal-card', () => closeRouteModal());
            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768 && isStopListOpen) toggleStopList(false);
            });
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (activeRouteId) closeRouteModal();
                else if (isStopListOpen) toggleStopList(false);
            }
        });
    </script>
</body>
</html>
